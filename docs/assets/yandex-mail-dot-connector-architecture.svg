<title id="title">Yandex Mail Dot Connector — Runtime Architecture</title>
<desc id="desc">Source-backed overview of the private Site adapter, signed Cloudflare bridge, separate D1 stores, Yandex OAuth and read-only IMAP.</desc>
<defs><marker id="arrow" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0 0L10 5L0 10z" fill="#94A3B8"/></marker>
<style>
.title{font:700 25px ui-monospace,SFMono-Regular,Menlo,Consolas,monospace;fill:#FFFFFF} .subtitle{font:400 13px ui-monospace,SFMono-Regular,Menlo,Consolas,monospace;fill:#94A3B8}
.zone{fill:#0F172A;stroke:#1E293B;stroke-width:1.5;stroke-dasharray:7 7;rx:18}.zoneLabel{font:700 11px ui-monospace,SFMono-Regular,Menlo,Consolas,monospace;letter-spacing:1.2px;fill:#94A3B8}
.nodeLabel{font:700 14px ui-monospace,SFMono-Regular,Menlo,Consolas,monospace;fill:#FFFFFF}.nodeSub{font:400 10.5px ui-monospace,SFMono-Regular,Menlo,Consolas,monospace;fill:#94A3B8}.tag{font:700 9px ui-monospace,SFMono-Regular,Menlo,Consolas,monospace;fill:#94A3B8}
.edge{fill:none;stroke:#94A3B8;stroke-width:1.8;marker-end:url(#arrow)}.edge.emphasis{stroke:#34D399;stroke-width:2.4}.edge.security{stroke:#FB7185;stroke-width:2.1}.edge.dashed{stroke-dasharray:7 6}
.edgeLabel{font:600 9.5px ui-monospace,SFMono-Regular,Menlo,Consolas,monospace;fill:#94A3B8;paint-order:stroke;stroke:#020617;stroke-width:4px;stroke-linejoin:round}

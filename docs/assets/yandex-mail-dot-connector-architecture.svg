</style></defs><rect width="1420" height="760" fill="#020617"/>
<text class="title" x="40" y="38">Yandex Mail Dot Connector — Runtime Architecture</text>
<text class="subtitle" x="40" y="60">source-backed @ bcab88f1eb26 · Archify v3 typed architecture source</text>

<rect class="zone" x="675" y="260" width="455" height="370"/><text class="zoneLabel" x="695" y="282">OWNER CLOUDFLARE BRIDGE</text>
<rect class="zone" x="900" y="55" width="485" height="140"/><text class="zoneLabel" x="920" y="76">YANDEX ID / OAUTH</text>
<rect class="zone" x="1145" y="260" width="230" height="165"/><text class="zoneLabel" x="1165" y="282">YANDEX MAIL</text><path class="edge emphasis" d="M190,353 L245,356"/><text class="edgeLabel" x="217.5" y="346.5" text-anchor="middle">MCP</text><path class="edge security" d="M413,356 L470,356"/><text class="edgeLabel" x="441.5" y="348" text-anchor="middle">trusted identity</text><path class="edge security" d="M636,356 L700,356"/><text class="edgeLabel" x="668" y="348" text-anchor="middle">signed HTTPS POST</text><path class="edge emphasis" d="M876,356 L940,356"/><text class="edgeLabel" x="908" y="348" text-anchor="middle">verified owner request</text><path class="edge emphasis" d="M1108,356 L1180,356"/><text class="edgeLabel" x="1144" y="348" text-anchor="middle">read-only TLS + XOAUTH2</text><path class="edge security" d="M553,392 L553,515"/><text class="edgeLabel" x="607" y="455" text-anchor="middle">signing key</text><path class="edge " d="M1024,392 L1024,515"/><text class="edgeLabel" x="1080" y="455" text-anchor="middle">token / state / nonce</text><path class="edge dashed" d="M190,113 L435,113 L435,356 L470,356"/><text class="edgeLabel" x="315" y="104" text-anchor="middle">setup / connect</text><path class="edge dashed" d="M190,113 L905,113 L905,116 L940,116"/><text class="edgeLabel" x="545" y="104" text-anchor="middle">browser consent</text><path class="edge security" d="M995,320 L995,152"/><text class="edgeLabel" x="1058" y="235" text-anchor="middle">PKCE + token exchange</text><path class="edge dashed" d="M1060,152 L1060,320"/><text class="edgeLabel" x="1100" y="265" text-anchor="middle">callback code</text><g id="owner"><rect x="40" y="80" width="150" height="66" rx="8" fill="#0F172A" stroke="#94A3B8" stroke-width="2"/><circle cx="56" cy="98" r="4" fill="#94A3B8"/><text class="nodeLabel" x="68" y="103">Owner / browser</text><text class="nodeSub" x="56" y="125">setup + consent</text></g><g id="dot"><rect x="40" y="320" width="150" height="66" rx="8" fill="#0F172A" stroke="#94A3B8" stroke-width="2"/><circle cx="56" cy="338" r="4" fill="#94A3B8"/><text class="nodeLabel" x="68" y="343">dot / MCP client</text><text class="nodeSub" x="56" y="365">five read-only tools</text></g><g id="sitesGate"><rect x="245" y="320" width="168" height="72" rx="8" fill="#0F172A" stroke="#FB7185" stroke-width="2"/><circle cx="261" cy="338" r="4" fill="#FB7185"/><text class="nodeLabel" x="273" y="343">Private Sites gate</text><text class="nodeSub" x="261" y="365">hosting auth + plugin OAuth</text><text class="tag" x="261" y="383">owner-only</text></g><g id="siteAdapter"><rect x="470" y="320" width="166" height="72" rx="8" fill="#0F172A" stroke="#34D399" stroke-width="2"/><circle cx="486" cy="338" r="4" fill="#34D399"/><text class="nodeLabel" x="498" y="343">Site adapter</text><text class="nodeSub" x="486" y="365">/mcp + setup API</text></g><g id="siteD1"><rect x="470" y="515" width="166" height="72" rx="8" fill="#0F172A" stroke="#A78BFA" stroke-width="2"/><circle cx="486" cy="533" r="4" fill="#A78BFA"/><text class="nodeLabel" x="498" y="538">Site D1</text><text class="nodeSub" x="486" y="560">Ed25519 private/public JWK</text><text class="tag" x="486" y="578">no mail token</text></g><g id="bridgeIngress"><rect x="700" y="320" width="176" height="72" rx="8" fill="#0F172A" stroke="#FB7185" stroke-width="2"/><circle cx="716" cy="338" r="4" fill="#FB7185"/><text class="nodeLabel" x="728" y="343">Bridge ingress</text><text class="nodeSub" x="716" y="365">rate limits + signature gate</text><text class="tag" x="716" y="383">public HTTPS</text></g><g id="bridgeCore"><rect x="940" y="320" width="168" height="72" rx="8" fill="#0F172A" stroke="#34D399" stroke-width="2"/><circle cx="956" cy="338" r="4" fill="#34D399"/><text class="nodeLabel" x="968" y="343">Bridge core</text><text class="nodeSub" x="956" y="365">OAuth + fixed mail routes</text></g><g id="bridgeD1"><rect x="940" y="515" width="168" height="72" rx="8" fill="#0F172A" stroke="#A78BFA" stroke-width="2"/><circle cx="956" cy="533" r="4" fill="#A78BFA"/><text class="nodeLabel" x="968" y="538">Bridge D1</text><text class="nodeSub" x="956" y="560">token + OAuth state + nonce</text><text class="tag" x="956" y="578">no private signing key</text></g><g id="yandexOAuth"><rect x="940" y="80" width="168" height="72" rx="8" fill="#0F172A" stroke="#94A3B8" stroke-width="2"/><circle cx="956" cy="98" r="4" fill="#94A3B8"/><text class="nodeLabel" x="968" y="103">Yandex OAuth</text><text class="nodeSub" x="956" y="125">authorization code + PKCE</text><text class="tag" x="956" y="143">mail:imap_ro</text></g><g id="yandexImap"><rect x="1180" y="320" width="176" height="72" rx="8" fill="#0F172A" stroke="#94A3B8" stroke-width="2"/><circle cx="1196" cy="338" r="4" fill="#94A3B8"/><text class="nodeLabel" x="1208" y="343">Yandex Mail IMAP</text><text class="nodeSub" x="1196" y="365">imap.yandex.com:993</text><text class="tag" x="1196" y="383">TLS + XOAUTH2</text></g><text class="noteTitle" x="40" y="675">MAIL READ</text><text class="noteText" x="40" y="695">dot → private Sites → signed bridge → read-only IMAP</text><text class="noteTitle" x="495" y="675">KEY ISOLATION</text><text class="noteText" x="495" y="695">Site D1: Ed25519 private key · Bridge D1: Yandex token/state/nonce</text><text class="noteTitle" x="950" y="675">OAUTH</text><text class="noteText" x="950" y="695">authorization code + PKCE · mail:imap_ro · refresh token discarded</text></svg>

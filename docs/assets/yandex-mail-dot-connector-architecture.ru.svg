<svg xmlns="http://www.w3.org/2000/svg" width="1420" height="760" viewBox="0 0 1420 760" role="img" aria-labelledby="title desc"><title id="title">Yandex Mail Dot Connector — архитектура выполнения</title><desc id="desc">Source-backed обзор приватного Site adapter, подписанного Cloudflare bridge, раздельных D1-хранилищ, Yandex OAuth и read-only IMAP.</desc><defs><marker id="arrow" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0 0L10 5L0 10z" fill="#94A3B8"/></marker><style>.title{font:700 25px ui-monospace,SFMono-Regular,Menlo,Consolas,monospace;fill:#FFFFFF}.subtitle{font:400 13px ui-monospace,SFMono-Regular,Menlo,Consolas,monospace;fill:#94A3B8}.zone{fill:#0F172A;stroke:#1E293B;stroke-width:1.5;stroke-dasharray:7 7;rx:18}.zoneLabel{font:700 11px ui-monospace,SFMono-Regular,Menlo,Consolas,monospace;letter-spacing:1.1px;fill:#94A3B8}.nodeLabel{font:700 13px ui-monospace,SFMono-Regular,Menlo,Consolas,monospace;fill:#FFFFFF}.nodeSub{font:400 10px ui-monospace,SFMono-Regular,Menlo,Consolas,monospace;fill:#94A3B8}.tag{font:700 8.7px ui-monospace,SFMono-Regular,Menlo,Consolas,monospace;fill:#94A3B8}.edge{fill:none;stroke:#94A3B8;stroke-width:1.8;marker-end:url(#arrow)}.edge.emphasis{stroke:#34D399;stroke-width:2.4}.edge.security{stroke:#FB7185;stroke-width:2.1}.edge.dashed{stroke-dasharray:7 6}.edgeLabel{font:600 9px ui-monospace,SFMono-Regular,Menlo,Consolas,monospace;fill:#94A3B8;paint-order:stroke;stroke:#020617;stroke-width:4px;stroke-linejoin:round}.noteTitle{font:700 11px ui-monospace,SFMono-Regular,Menlo,Consolas,monospace;fill:#FFFFFF}.noteText{font:400 9.7px ui-monospace,SFMono-Regular,Menlo,Consolas,monospace;fill:#94A3B8}</style></defs><rect width="1420" height="760" fill="#020617"/><text class="title" x="40" y="38">Yandex Mail Dot Connector — архитектура выполнения</text><text class="subtitle" x="40" y="60">source-backed @ bcab88f1eb26 · русская версия</text><rect class="zone" x="220" y="260" width="440" height="370"/><text class="zoneLabel" x="240" y="282">ПРИВАТНЫЙ SITES / ТОЛЬКО ВЛАДЕЛЕЦ</text><rect class="zone" x="675" y="260" width="455" height="370"/><text class="zoneLabel" x="695" y="282">CLOUDFLARE BRIDGE ВЛАДЕЛЬЦА</text><rect class="zone" x="900" y="55" width="485" height="140"/><text class="zoneLabel" x="920" y="76">YANDEX ID / OAUTH</text><rect class="zone" x="1145" y="260" width="230" height="165"/><text class="zoneLabel" x="1165" y="282">YANDEX ПОЧТА</text><path class="edge emphasis" d="M190,353 L245,356"/><text class="edgeLabel" x="217.5" y="346.5" text-anchor="middle">MCP</text><path class="edge security" d="M413,356 L470,356"/><text class="edgeLabel" x="441.5" y="348" text-anchor="middle">доверенная identity</text><path class="edge security" d="M636,356 L700,356"/><text class="edgeLabel" x="668" y="348" text-anchor="middle">подписанный HTTPS POST</text><path class="edge emphasis" d="M876,356 L940,356"/><text class="edgeLabel" x="908" y="348" text-anchor="middle">проверенный запрос владельца</text><path class="edge emphasis" d="M1108,356 L1180,356"/><text class="edgeLabel" x="1144" y="348" text-anchor="middle">только чтение TLS + XOAUTH2</text><path class="edge security" d="M553,392 L553,515"/><text class="edgeLabel" x="607" y="455" text-anchor="middle">ключ подписи</text><path class="edge " d="M1024,392 L1024,515"/><text class="edgeLabel" x="1080" y="455" text-anchor="middle">token / state / nonce</text><path class="edge dashed" d="M190,113 L435,113 L435,356 L470,356"/><text class="edgeLabel" x="315" y="104" text-anchor="middle">настройка / подключение</text><path class="edge dashed" d="M190,113 L905,113 L905,116 L940,116"/><text class="edgeLabel" x="545" y="104" text-anchor="middle">согласие в браузере</text><path class="edge security" d="M995,320 L995,152"/><text class="edgeLabel" x="1058" y="235" text-anchor="middle">PKCE + обмен токена</text><path class="edge dashed" d="M1060,152 L1060,320"/><text class="edgeLabel" x="1100" y="265" text-anchor="middle">callback code</text><g id="owner"><rect x="40" y="80" width="150" height="66" rx="8" fill="#0F172A" stroke="#94A3B8" stroke-width="2"/><circle cx="56" cy="98" r="4" fill="#94A3B8"/><text class="nodeLabel" x="68" y="103">Владелец / браузер</text><text class="nodeSub" x="56" y="125">настройка + согласие</text></g><g id="dot"><rect x="40" y="320" width="150" height="66" rx="8" fill="#0F172A" stroke="#94A3B8" stroke-width="2"/><circle cx="56" cy="338" r="4" fill="#94A3B8"/><text class="nodeLabel" x="68" y="343">dot / MCP-клиент</text><text class="nodeSub" x="56" y="365">5 инструментов только чтения</text></g><g id="sitesGate"><rect x="245" y="320" width="168" height="72" rx="8" fill="#0F172A" stroke="#FB7185" stroke-width="2"/><circle cx="261" cy="338" r="4" fill="#FB7185"/><text class="nodeLabel" x="273" y="343">Приватный шлюз Sites</text><text class="nodeSub" x="261" y="365">hosting auth + plugin OAuth</text><text class="tag" x="261" y="383">только владелец</text></g><g id="siteAdapter"><rect x="470" y="320" width="166" height="72" rx="8" fill="#0F172A" stroke="#34D399" stroke-width="2"/><circle cx="486" cy="338" r="4" fill="#34D399"/><text class="nodeLabel" x="498" y="343">Site adapter</text><text class="nodeSub" x="486" y="365">/mcp + API настройки</text></g><g id="siteD1"><rect x="470" y="515" width="166" height="72" rx="8" fill="#0F172A" stroke="#A78BFA" stroke-width="2"/><circle cx="486" cy="533" r="4" fill="#A78BFA"/><text class="nodeLabel" x="498" y="538">Site D1</text><text class="nodeSub" x="486" y="560">приватный/публичный Ed25519 JWK</text><text class="tag" x="486" y="578">без mail token</text></g><g id="bridgeIngress"><rect x="700" y="320" width="176" height="72" rx="8" fill="#0F172A" stroke="#FB7185" stroke-width="2"/><circle cx="716" cy="338" r="4" fill="#FB7185"/><text class="nodeLabel" x="728" y="343">Вход bridge</text><text class="nodeSub" x="716" y="365">rate limit + проверка подписи</text><text class="tag" x="716" y="383">публичный HTTPS</text></g><g id="bridgeCore"><rect x="940" y="320" width="168" height="72" rx="8" fill="#0F172A" stroke="#34D399" stroke-width="2"/><circle cx="956" cy="338" r="4" fill="#34D399"/><text class="nodeLabel" x="968" y="343">Ядро bridge</text><text class="nodeSub" x="956" y="365">OAuth + фиксированные mail routes</text></g><g id="bridgeD1"><rect x="940" y="515" width="168" height="72" rx="8" fill="#0F172A" stroke="#A78BFA" stroke-width="2"/><circle cx="956" cy="533" r="4" fill="#A78BFA"/><text class="nodeLabel" x="968" y="538">Bridge D1</text><text class="nodeSub" x="956" y="560">token + OAuth state + nonce</text><text class="tag" x="956" y="578">без приватного signing key</text></g><g id="yandexOAuth"><rect x="940" y="80" width="168" height="72" rx="8" fill="#0F172A" stroke="#94A3B8" stroke-width="2"/><circle cx="956" cy="98" r="4" fill="#94A3B8"/><text class="nodeLabel" x="968" y="103">Yandex OAuth</text><text class="nodeSub" x="956" y="125">authorization code + PKCE</text><text class="tag" x="956" y="143">mail:imap_ro</text></g><g id="yandexImap"><rect x="1180" y="320" width="176" height="72" rx="8" fill="#0F172A" stroke="#94A3B8" stroke-width="2"/><circle cx="1196" cy="338" r="4" fill="#94A3B8"/><text class="nodeLabel" x="1208" y="343">Yandex Mail IMAP</text><text class="nodeSub" x="1196" y="365">imap.yandex.com:993</text><text class="tag" x="1196" y="383">TLS + XOAUTH2</text></g><text class="noteTitle" x="40" y="675">ЧТЕНИЕ ПОЧТЫ</text><text class="noteText" x="40" y="695">dot → приватный Sites → подписанный bridge → IMAP только для чтения</text><text class="noteTitle" x="495" y="675">ИЗОЛЯЦИЯ КЛЮЧЕЙ</text><text class="noteText" x="495" y="695">Site D1: приватный Ed25519 · Bridge D1: Yandex token/state/nonce</text><text class="noteTitle" x="950" y="675">OAUTH</text><text class="noteText" x="950" y="695">authorization code + PKCE · mail:imap_ro · refresh token отбрасывается</text></svg>

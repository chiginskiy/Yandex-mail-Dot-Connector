name: Prepare release candidate
# This workflow creates a review artifact only. It never deploys or publishes a release.
on:
  workflow_dispatch:
permissions:
  contents: read
jobs:
  package:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    env:
      WRANGLER_SEND_METRICS: 'false'
    steps:
      - uses: actions/checkout@08c6903cd8c0fde910a37f88322edcfb5dd907a8 # v5.0.0
        with:
          persist-credentials: false
      - uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
        with:
          node-version: '24.19.0'
          package-manager-cache: false
      - run: npm run deps
      - run: npm run verify
      - run: npm run notices
      - run: git diff --exit-code -- THIRD_PARTY_NOTICES.md
      - run: npm run package
      - run: node scripts/verify-zip.mjs
      - uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4.6.2
        with:
          name: reviewed-source-and-runtime-candidate
          path: |
            releases/*.zip
            releases/SHA256SUMS.txt
          if-no-files-found: error
          retention-days: 14

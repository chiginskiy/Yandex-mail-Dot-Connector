name: Bug report
description: Report a reproducible problem using synthetic information only
title: '[Bug] '
labels: []
body:
  - type: markdown
    attributes:
      value: |
        Do not include mail, attachments, mailbox addresses, tokens, connection files,
        account IDs, deployed URLs, private keys, or full logs. Use SECURITY.md for vulnerabilities.
  - type: input
    id: version
    attributes:
      label: Release, Node.js version and operating system
    validations:
      required: true
  - type: textarea
    id: steps
    attributes:
      label: Steps with synthetic data
    validations:
      required: true
  - type: textarea
    id: result
    attributes:
      label: Expected and actual result, safe error code only
    validations:
      required: true
